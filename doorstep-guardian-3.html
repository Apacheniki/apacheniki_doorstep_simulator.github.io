<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訪問者ファイル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-dark:#1c130d;
    --wood:#33241a;
    --wood-light:#4a3626;
    --parchment:#EFE3C8;
    --parchment-dark:#e0d0a6;
    --brass:#B8935A;
    --brass-light:#DDC08D;
    --brass-dark:#7c5f34;
    --ink:#241a12;
    --ink-soft:#6b5a44;
    --safe:#4FA88C;
    --safe-light:#7FCBB0;
    --warn:#D98A3D;
    --danger:#B23A2E;
    --danger-light:#E2604F;
    --shadow: 0 12px 32px rgba(8,5,2,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -15%, #6b4c30 0%, transparent 55%),
      repeating-linear-gradient(90deg, var(--wood) 0px, var(--wood) 42px, var(--wood-light) 42px, var(--wood-light) 44px);
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--parchment);
    display:flex;
    justify-content:center;
    padding:26px 12px 60px;
  }
  .stage-wrap{ width:100%; max-width:460px; }

  .door-panel{
    background: radial-gradient(ellipse at 50% 0%, #3d2c1e 0%, var(--wood-dark) 70%);
    border-radius:16px;
    padding:20px 18px 20px;
    box-shadow: var(--shadow), inset 0 0 0 2px rgba(184,147,90,0.5), inset 0 0 40px rgba(0,0,0,0.5);
    position:relative;
    overflow:hidden;
  }
  .door-panel::before{
    content:"";
    position:absolute; inset:9px;
    border:1px solid rgba(221,192,141,0.22);
    border-radius:11px;
    pointer-events:none;
  }
  .rivet{
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--brass-light), var(--brass-dark));
    box-shadow:0 1px 2px rgba(0,0,0,0.6);
  }
  .rivet.tl{top:14px; left:14px;} .rivet.tr{top:14px; right:14px;}
  .rivet.bl{bottom:14px; left:14px;} .rivet.br{bottom:14px; right:14px;}

  .gear{ position:absolute; opacity:0.22; transform-origin:center; }
  .gear.spin{ animation: spin 18s linear infinite; }
  .gear.spin.rev{ animation-direction:reverse; animation-duration:24s; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .gear.g1{ top:6px; left:6px; width:34px; height:34px; }
  .gear.g2{ bottom:6px; right:6px; width:26px; height:26px; }

  .log-header{
    text-align:center; margin-bottom:12px; padding-bottom:9px;
    border-bottom:1px dashed rgba(221,192,141,0.35); position:relative; z-index:1;
  }
  .log-date{ font-family:'Zen Antique', serif; font-size:15px; letter-spacing:0.1em; color:var(--brass-light); }
  .log-sub{ font-size:10.5px; letter-spacing:0.14em; color:#a8977a; margin-top:2px; }

  .panel-inner{ animation: fadeSlide 0.45s ease; }
  @keyframes fadeSlide{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

  /* ---------- title screen ---------- */
  .title-screen{ text-align:center; padding:12px 2px 4px; position:relative; z-index:1; }
  .title-cover{
    font-family:'Zen Antique', serif; font-size:24px; letter-spacing:0.16em;
    color:var(--brass-light); margin:6px 0 2px; text-shadow:0 2px 6px rgba(0,0,0,0.6);
  }
  .title-month{ font-size:12px; letter-spacing:0.2em; color:#c9b98f; margin-bottom:18px; }
  .title-lede{
    text-align:left; font-size:13px; line-height:1.9; color:#ecdfc4;
    background:rgba(0,0,0,0.22); border-radius:8px; padding:14px 16px; margin-bottom:12px;
  }
  .title-purpose{
    text-align:left; font-size:11.5px; line-height:1.85; color:#c9b98f;
    background:rgba(0,0,0,0.15); border-radius:8px; padding:12px 14px; margin-bottom:18px;
    border:1px solid rgba(184,147,90,0.3);
  }
  .title-purpose b{ color:var(--brass-light); font-weight:700; }

  .peephole-row{ display:flex; justify-content:center; margin-bottom:10px; position:relative; z-index:1; }
  .peephole{
    width:150px; height:150px; border-radius:50%; position:relative;
    background: radial-gradient(circle at 50% 42%, #2b2016 0%, #0c0906 62%, #050403 100%);
    box-shadow:
      0 0 0 5px var(--brass-dark), 0 0 0 8px var(--brass), 0 0 0 10px rgba(0,0,0,0.5),
      inset 0 0 26px 10px rgba(0,0,0,0.85);
    overflow:hidden; display:flex; align-items:center; justify-content:center;
  }
  .peephole .screw{ position:absolute; width:7px; height:7px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--brass-light), var(--brass-dark)); }
  .peephole .screw::after{ content:""; position:absolute; top:50%; left:8%; width:84%; height:1px;
    background:rgba(30,20,8,0.7); transform:rotate(35deg); }
  .s1{top:-3px; left:50%; margin-left:-3.5px;} .s2{bottom:-3px; left:50%; margin-left:-3.5px;}
  .s3{left:-3px; top:50%; margin-top:-3.5px;} .s4{right:-3px; top:50%; margin-top:-3.5px;}

  .peephole .visitor{ width:70%; height:70%; transition: transform 0.6s ease; position:relative; z-index:1; }
  .peephole .visitor svg{ width:100%; height:100%; display:block; }

  .flash-pulse{
    position:absolute; inset:0; border-radius:50%; pointer-events:none;
    animation: flashPulse 0.75s ease; z-index:2;
  }
  @keyframes flashPulse{ 0%{opacity:0;} 28%{opacity:0.6;} 100%{opacity:0;} }

  .shake{ animation: shakeMe 0.42s ease; }
  @keyframes shakeMe{
    0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-5px); }
    40%{ transform:translateX(4px); } 60%{ transform:translateX(-3px); } 80%{ transform:translateX(2px); }
  }

  .alert-light{
    position:absolute; top:6px; right:6px; width:9px; height:9px; border-radius:50%;
    background:var(--danger-light); box-shadow:0 0 6px 2px rgba(226,96,79,0.4);
    opacity:0; transition:opacity 0.4s; z-index:1;
  }
  .alert-light.on{ opacity:1; animation:blink 0.9s infinite; }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  .visitor-name{
    text-align:center; font-family:'Zen Antique', serif; font-weight:400;
    font-size:15px; letter-spacing:0.1em; color:var(--parchment); margin-bottom:2px;
  }
  .clue-line{ text-align:center; font-size:11.5px; color:#c9b98f; letter-spacing:0.03em; margin-bottom:14px; font-style:italic; }

  .gauge-wrap{ display:flex; flex-direction:column; align-items:center; margin-bottom:12px; }
  .gauge-wrap svg{ width:190px; height:auto; overflow:visible; }
  #needleLine{ transition: transform 0.7s cubic-bezier(.34,1.4,.4,1); transform-origin:100px 100px; }
  .gauge-caption{ font-size:11px; letter-spacing:0.12em; color:var(--brass-light); margin-top:-6px; }
  .gauge-caption b{ color:var(--parchment); font-variant-numeric:tabular-nums; margin-left:4px; }

  .speech{
    background: linear-gradient(180deg, var(--parchment), var(--parchment-dark));
    border-radius:4px; padding:16px 16px 14px; box-shadow: var(--shadow);
    position:relative; margin-bottom:14px; min-height:60px; border:1px solid rgba(124,95,52,0.4);
  }
  .speech::before{
    content:""; position:absolute; top:-9px; left:50%; margin-left:-9px;
    width:18px; height:18px; background:var(--parchment);
    transform:rotate(45deg); border-left:1px solid rgba(124,95,52,0.4); border-top:1px solid rgba(124,95,52,0.4);
  }
  .speech-tag{ font-size:10.5px; color:var(--ink-soft); letter-spacing:0.1em; margin-bottom:6px; }
  .speech-line{ font-size:14.5px; line-height:1.75; color:var(--ink); }

  .choices{ display:flex; flex-direction:column; gap:9px; }
  .choice-btn{
    text-align:left; background: linear-gradient(180deg, #4a3626, #33241a);
    color:var(--parchment); border:1px solid rgba(184,147,90,0.45);
    border-radius:8px; padding:11px 14px 11px 38px;
    font-family:inherit; font-size:13.5px; line-height:1.5; cursor:pointer;
    position:relative; transition: background 0.15s, transform 0.1s;
  }
  .choice-btn:hover{ background: linear-gradient(180deg, #5a4230, #3d2c1e); }
  .choice-btn:active{ transform:scale(0.985); }
  .choice-btn:focus-visible{ outline:2px solid var(--brass-light); outline-offset:2px; }
  .choice-btn::before{
    content:""; position:absolute; left:13px; top:50%; margin-top:-4px;
    width:8px; height:8px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, var(--brass-light), var(--brass-dark));
    box-shadow:0 0 0 2px rgba(0,0,0,0.3);
  }
  .choice-btn:disabled{ opacity:0.4; cursor:default; }

  .reaction-toast{ margin-top:12px; font-size:12.5px; color:var(--brass-light); text-align:center; letter-spacing:0.02em; min-height:16px; line-height:1.7; }

  .next-row{ margin-top:14px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  .next-btn{
    background: linear-gradient(180deg, var(--brass-light), var(--brass));
    color:var(--wood-dark); border:none; border-radius:18px; padding:9px 22px;
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:13px;
    letter-spacing:0.05em; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }
  .next-btn:hover{ background: var(--brass-light); }
  .next-btn.ghost{
    background:transparent; color:var(--brass-light); border:1px solid rgba(184,147,90,0.5); box-shadow:none;
  }

  .flip-card{ perspective:900px; margin:8px 0 4px; }
  .flip-inner{
    position:relative; width:100%; min-height:180px;
    transition: transform 0.85s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d;
  }
  .flip-inner.flipped{ transform:rotateY(180deg); }
  .flip-front, .flip-back{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:14px; border-radius:10px;
  }
  .flip-front{ background:linear-gradient(180deg,#4a3626,#33241a); border:1px solid rgba(184,147,90,0.4); }
  .flip-back{
    background: linear-gradient(180deg,var(--parchment),var(--parchment-dark));
    color:var(--ink); transform:rotateY(180deg); border:1px solid rgba(124,95,52,0.4);
  }
  .seal{ width:52px; height:52px; margin-bottom:10px; }
  .flip-front .cap{ font-size:12px; letter-spacing:0.14em; color:#c9b98f; }
  .flip-back .reveal-title{ font-size:11.5px; color:var(--ink-soft); letter-spacing:0.1em; margin-bottom:4px; }
  .flip-back .reveal-name{ font-family:'Zen Antique', serif; font-size:17px; margin-bottom:6px; }
  .flip-back .reveal-flavor{ font-size:12.5px; line-height:1.7; color:var(--ink-soft); }

  .fail-screen{ text-align:center; padding:6px 2px 4px; position:relative; }
  .stamp{
    display:inline-block; border:4px double var(--danger-light); color:var(--danger-light);
    font-family:'Zen Antique', serif; font-size:19px; letter-spacing:0.12em;
    padding:8px 18px; transform:rotate(-6deg); margin:6px 0 16px;
    text-shadow:0 0 6px rgba(226,96,79,0.4); animation: stampIn 0.4s ease;
  }
  @keyframes stampIn{
    0%{ transform:rotate(-6deg) scale(2.2); opacity:0; }
    60%{ transform:rotate(-6deg) scale(0.94); opacity:1; }
    100%{ transform:rotate(-6deg) scale(1); }
  }
  .fail-desc{ font-size:13px; line-height:1.9; color:#ecdfc4; margin-bottom:16px; text-align:left; background:rgba(0,0,0,0.25); border-radius:8px; padding:14px 16px; }

  .end-screen{ text-align:center; }
  .end-rank{
    font-family:'Zen Antique', serif; font-size:52px; font-weight:400; margin:4px 0 2px;
    color:var(--brass-light); text-shadow:0 3px 10px rgba(0,0,0,0.6);
    animation: rankPop 0.5s cubic-bezier(.34,1.6,.4,1);
  }
  @keyframes rankPop{ 0%{ transform:scale(0.3); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  .end-title{ font-size:14.5px; letter-spacing:0.08em; margin-bottom:6px; color:var(--parchment); }
  .end-community{ font-size:12px; color:#c9b98f; margin-bottom:14px; }
  .end-desc{ font-size:13px; line-height:1.9; color:#ecdfc4; margin-bottom:16px; text-align:left; background:rgba(0,0,0,0.22); border-radius:8px; padding:14px 16px; }
  .tips{ text-align:left; background:rgba(0,0,0,0.25); border-radius:8px; padding:14px 16px; margin-bottom:16px; border:1px solid rgba(184,147,90,0.35); }
  .tips h3{ margin:0 0 8px; font-size:12px; letter-spacing:0.1em; color:var(--brass-light); font-family:'Zen Antique', serif; font-weight:400; }
  .tips ol{ margin:0; padding-left:18px; font-size:12.5px; line-height:1.9; color:#ecdfc4; }

  /* ---------- results index / detail ---------- */
  .results-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .result-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background: linear-gradient(180deg, #4a3626, #33241a);
    border:1px solid rgba(184,147,90,0.4); border-radius:8px;
    padding:11px 14px; font-size:13px; color:var(--parchment); cursor:pointer; text-align:left;
    width:100%; font-family:inherit;
  }
  .result-item:hover{ background: linear-gradient(180deg, #5a4230, #3d2c1e); }
  .result-item .rname{ font-family:'Zen Antique', serif; font-size:13.5px; }
  .result-item .rverdict{ font-size:11.5px; color:var(--brass-light); white-space:nowrap; }
  .transcript{ display:flex; flex-direction:column; gap:12px; margin-bottom:16px; }
  .qa{ background:rgba(0,0,0,0.22); border-radius:8px; padding:12px 14px; }
  .qa .q{ font-size:12px; color:#c9b98f; margin-bottom:6px; line-height:1.7; }
  .qa .a{ font-size:13px; color:var(--parchment); margin-bottom:5px; line-height:1.6; }
  .qa .r{ font-size:11.5px; color:var(--brass-light); font-style:italic; line-height:1.6; }
  .detail-header{ text-align:center; margin-bottom:12px; }
  .detail-header .dname{ font-family:'Zen Antique', serif; font-size:17px; color:var(--parchment); }
  .detail-header .dreveal{ font-size:12px; color:#c9b98f; margin-top:3px; }

  footer.note{ text-align:center; font-size:10.5px; color:#a8977a; margin-top:14px; letter-spacing:0.03em; }

  @media (prefers-reduced-motion: reduce){
    .alert-light.on{ animation:none; opacity:1; }
    .gear.spin{ animation:none; }
    .panel-inner{ animation:none; }
    .flash-pulse{ animation:none; opacity:0; }
    .shake{ animation:none; }
    .stamp{ animation:none; }
    .end-rank{ animation:none; }
    #needleLine{ transition:none; }
    .flip-inner{ transition:none; }
    *{ transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>
<div class="stage-wrap">
  <div class="door-panel" id="panel"></div>
  <footer class="note">※ これは架空の来訪者との練習用シミュレーションです。実際の対応の参考としてもご活用ください。</footer>
</div>

<script>
/* ---------- icon library ---------- */
const ICONS = {
  leaflet: `<svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="16" fill="#d8c9a8"/><path d="M20 96 Q22 58 50 56 Q78 58 80 96 Z" fill="#7c6a4a"/><rect x="60" y="50" width="20" height="26" rx="2" fill="#e9dfc2" stroke="#7c6a4a" stroke-width="2"/></svg>`,
  clipboard: `<svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="16" fill="#d8c9a8"/><path d="M20 96 Q22 58 50 56 Q78 58 80 96 Z" fill="#5c6a5c"/><rect x="34" y="46" width="20" height="26" rx="2" fill="#e9dfc2" stroke="#5c6a5c" stroke-width="2"/><line x1="38" y1="53" x2="50" y2="53" stroke="#5c6a5c" stroke-width="2"/><line x1="38" y1="59" x2="50" y2="59" stroke="#5c6a5c" stroke-width="2"/></svg>`,
  flower: `<svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="16" fill="#e0c9c9"/><path d="M20 96 Q22 58 50 56 Q78 58 80 96 Z" fill="#a45c5c"/><circle cx="70" cy="52" r="5" fill="#e79a9a"/><circle cx="76" cy="58" r="5" fill="#e79a9a"/><circle cx="64" cy="58" r="5" fill="#e79a9a"/><circle cx="70" cy="58" r="4" fill="#e7c95a"/></svg>`,
  briefcase: `<svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="16" fill="#c9c2b0"/><path d="M20 96 Q22 58 50 56 Q78 58 80 96 Z" fill="#2f3a4a"/><rect x="34" y="48" width="32" height="20" rx="2" fill="#3d4a5c" stroke="#8A6B3E" stroke-width="2"/><rect x="44" y="43" width="12" height="8" rx="2" fill="none" stroke="#8A6B3E" stroke-width="2"/></svg>`,
  box: `<svg viewBox="0 0 100 100"><circle cx="50" cy="30" r="14" fill="#dcd3bd"/><path d="M22 96 Q24 62 50 60 Q76 62 78 96 Z" fill="#4a6a8a"/><rect x="30" y="56" width="30" height="26" fill="#c99a5b" stroke="#8A6B3E" stroke-width="2"/><line x1="30" y1="69" x2="60" y2="69" stroke="#8A6B3E" stroke-width="2"/><line x1="45" y1="56" x2="45" y2="82" stroke="#8A6B3E" stroke-width="2"/></svg>`,
  pot: `<svg viewBox="0 0 100 100"><circle cx="50" cy="32" r="15" fill="#e3cdb0"/><path d="M20 96 Q22 60 50 58 Q78 60 80 96 Z" fill="#8a5c4a"/><path d="M38 66 Q50 58 62 66 L60 78 Q50 84 40 78 Z" fill="#6b6b6b" stroke="#444" stroke-width="1.5"/><rect x="46" y="60" width="8" height="6" fill="#444"/></svg>`,
  meter: `<svg viewBox="0 0 100 100"><circle cx="50" cy="32" r="15" fill="#cdd3c9"/><path d="M20 96 Q22 60 50 58 Q78 60 80 96 Z" fill="#4a6a52"/><rect x="36" y="66" width="22" height="16" rx="2" fill="#e9dfc2" stroke="#333" stroke-width="2"/><circle cx="47" cy="74" r="5" fill="none" stroke="#333" stroke-width="1.5"/></svg>`
};
const SEAL_SVG = `<svg class="seal" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#8A6B3E" stroke="#DDC08D" stroke-width="3"/><circle cx="50" cy="50" r="30" fill="none" stroke="#EFE3C8" stroke-width="1.5" stroke-dasharray="3 4"/><circle cx="50" cy="50" r="10" fill="#EFE3C8"/></svg>`;
const GEAR_SVG = `<svg viewBox="0 0 100 100" fill="#DDC08D"><path d="M50 8 L58 8 L60 22 L72 26 L83 17 L90 24 L81 35 L85 47 L99 50 L99 58 L85 60 L81 72 L90 83 L83 90 L72 81 L60 85 L58 99 L50 99 L47 85 L35 81 L24 90 L17 83 L26 72 L22 60 L8 58 L8 50 L22 47 L26 35 L17 24 L24 17 L35 26 L47 22 Z M50 36 A14 14 0 1 0 50 64 A14 14 0 1 0 50 36 Z"/></svg>`;

/* ---------- case data (round graph: start -> nodes keyed by id, choice.next = id or 'END') ---------- */
const CASES = [
  {
    type:'decoy', name:'宅配便配達員', icon:'box',
    clue:'手には大きな段ボール箱を抱えている。',
    reveal:'ただの宅配便配達員だった。',
    start:'r1',
    nodes:{
      r1:{
        line:'お荷物のお届けです。こちらにサインをお願いできますか?',
        choices:[
          { text:'サインをして荷物を受け取る', tone:'good', communityDelta:10, next:'END',
            reaction:'「ありがとうございました!」と笑顔で去っていった。' },
          { text:'配達員証を確認してからサインする', tone:'good', communityDelta:14, next:'END',
            reaction:'「はい、こちらです」ときちんと提示してくれた。安心して受け取れた。' },
          { text:'「頼んだ覚えはありません」と追い返す', tone:'cold', communityDelta:-15, next:'END',
            reaction:'「え…でも、確かにご注文の記録が…」と困った様子だった。' },
          { text:'「今週は一人で家にいるんです」と世間話をする', tone:'overshare', communityDelta:2, next:'END',
            reaction:'配達員は少し驚いた顔をしたが、そのまま業務を終えて帰っていった。' }
        ]
      }
    }
  },
  {
    type:'solicitor', name:'パンフレット配布員', icon:'leaflet',
    clue:'手には紙の束を抱え、にこやかな笑顔を絶やさない。',
    reveal:'正体は宗教団体の勧誘員だった。',
    start:'r1',
    nodes:{
      r1:{
        line:'こんにちは、お近くを回らせていただいてます。少しだけお時間よろしいですか?',
        choices:[
          { text:'「すみません、今忙しいので」ときっぱり断る', tone:'good', pressureDelta:-15, next:'r2',
            reaction:'「あ、そうですか…では失礼します」少し驚いた様子で一歩下がった。' },

const DAY_OFFSETS = [0, 2, 5, 8, 12, 16, 21];
const START_MONTH = 6, START_DAY = 3;
function dateStrFor(idx){
  const o = DAY_OFFSETS[Math.min(idx, DAY_OFFSETS.length-1)];
  return `20XX年${START_MONTH}月${START_DAY + o}日`;
}
function dateStrEpilogue(){
  const o = DAY_OFFSETS[DAY_OFFSETS.length-1] + 3;
  return `20XX年${START_MONTH}月${START_DAY + o}日`;
}

/* ---------- state ---------- */
let caseIdx = 0, currentRoundId = null;
let pressure = 15, community = 50, firmCount = 0;
let ended = false;
let history = [];

const totalPressureRounds = CASES.filter(c=>c.type==='solicitor')
  .reduce((a,c)=>a+Object.keys(c.nodes).length,0);

const panel = document.getElementById('panel');
const clamp = v => Math.max(0, Math.min(100, v));

function decorFrame(){
  return `
    <div class="rivet tl"></div><div class="rivet tr"></div>
    <div class="rivet bl"></div><div class="rivet br"></div>
    <div class="gear g1 spin">${GEAR_SVG}</div>
    <div class="gear g2 spin rev">${GEAR_SVG}</div>
  `;
}
function logHeader(dateStr, sub){
  return `<div class="log-header"><div class="log-date">${dateStr}</div><div class="log-sub">${sub}</div></div>`;
}
function setPanel(html){
  panel.innerHTML = `${decorFrame()}<div class="panel-inner">${html}</div>`;
}
function needleAngle(v){ return (v/100*180) - 90; }

function gaugeSVG(v){
  return `
    <div class="gauge-wrap">
      <svg viewBox="0 0 200 115">
        <path d="M20,100 A80,80 0 0 1 75.3,23.9" fill="none" stroke="#4FA88C" stroke-width="11" stroke-linecap="round"/>
        <path d="M75.3,23.9 A80,80 0 0 1 147.0,35.3" fill="none" stroke="#D98A3D" stroke-width="11" stroke-linecap="round"/>
        <path d="M147.0,35.3 A80,80 0 0 1 180,100" fill="none" stroke="#B23A2E" stroke-width="11" stroke-linecap="round"/>
        <line id="needleLine" x1="100" y1="100" x2="100" y2="32" stroke="#EFE3C8" stroke-width="3.5" stroke-linecap="round"
          style="transform:rotate(${needleAngle(v)}deg)"/>
        <circle cx="100" cy="100" r="8" fill="#B8935A" stroke="#7c5f34" stroke-width="2"/>
      </svg>
      <div class="gauge-caption" id="gaugeCaption">危険度<b id="gaugeNum">${v}</b></div>
    </div>
  `;
}

/* ---------- title screen ---------- */

  setPanel(`

      <div class="title-month">— 20XX年6月 —</div>
      <div class="title-lede">

      </div>
      <div class="title-purpose">

        これは、突然の来訪者にどう対応すればよいかをあらかじめ体験し、不安を解消して防犯意識を高めることを目的とした啓発シミュレーションです。実在の団体・個人とは関係ありません。
      </div>
      <div class="next-row"><button class="next-btn" id="startBtn">ファイルを開く</button></div>
    </div>
  `);
  document.getElementById('startBtn').addEventListener('click', ()=>{
    caseIdx=0; currentRoundId=null; render();
  });

function render(){
  if(ended) return;
  if(caseIdx >= CASES.length){ renderEnding(); return; }

  const c = CASES[caseIdx];
  if(!currentRoundId) currentRoundId = c.start;
  const node = c.nodes[currentRoundId];
  const alertOn = c.type==='solicitor' && pressure >= 65;
  const scale = 1 + (c.type==='solicitor' ? (pressure/100)*0.28 : 0);

  setPanel(`
    ${logHeader(dateStrFor(caseIdx), `訪問者ファイル No.${caseIdx+1} / ${CASES.length}`)}
    <div class="peephole-row">
      <div class="peephole">
        <div class="screw s1"></div><div class="screw s2"></div>
        <div class="screw s3"></div><div class="screw s4"></div>
        <div class="alert-light ${alertOn?'on':''}"></div>
        <div class="visitor" style="transform:scale(${scale.toFixed(2)})">${ICONS[c.icon]}</div>
      </div>
    </div>
    <div class="visitor-name">正体不明の来訪者</div>
    <div class="clue-line">手がかり:${c.clue}</div>

    ${gaugeSVG(pressure)}

    <div class="speech">
      <div class="speech-tag">来訪者の言葉</div>
      <div class="speech-line">${node.line}</div>
    </div>

    <div class="choices" id="choicesBox">
      ${node.choices.map((ch,i)=>`<button class="choice-btn" data-i="${i}">${ch.text}</button>`).join('')}
    </div>
    <div class="reaction-toast" id="reactionToast"></div>
  `);

  document.querySelectorAll('.choice-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> pickChoice(parseInt(btn.dataset.i)));
  });
}

function toneColor(tone){
  if(tone==='good') return 'rgba(79,168,140,0.85)';
  if(tone==='bad' || tone==='verybad') return 'rgba(178,58,46,0.85)';
  if(tone==='cold') return 'rgba(178,58,46,0.6)';
  return 'rgba(217,138,61,0.75)';
}
function flashPeephole(tone){
  const hole = document.querySelector('.peephole');
  if(!hole) return;
  const f = document.createElement('div');
  f.className = 'flash-pulse';
  f.style.background = `radial-gradient(circle, ${toneColor(tone)} 0%, transparent 70%)`;
  hole.appendChild(f);
  setTimeout(()=> f.remove(), 800);
  if(tone==='bad' || tone==='verybad'){
    const panelEl = document.getElementById('panel');
    panelEl.classList.add('shake');
    setTimeout(()=> panelEl.classList.remove('shake'), 450);
  }
}
function animateNumber(el, from, to, duration){
  const start = performance.now();
  function step(now){
    const t = Math.min(1, (now-start)/duration);
    el.textContent = Math.round(from + (to-from)*t);
    if(t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function pickChoice(i){
  const c = CASES[caseIdx];
  const node = c.nodes[currentRoundId];
  const ch = node.choices[i];

  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled = true);
  document.getElementById('reactionToast').textContent = ch.reaction;
  flashPeephole(ch.tone);

  if(!history[caseIdx]) history[caseIdx] = { name:c.name, type:c.type, reveal:c.reveal, entries:[] };
  history[caseIdx].entries.push({
    line: node.line, choiceText: ch.text, reaction: ch.reaction, tone: ch.tone,
    delta: c.type==='solicitor' ? (ch.pressureDelta||0) : (ch.communityDelta||0)
  });

  if(ch.instantFail){
    setTimeout(()=> renderFail(ch.failTitle, ch.failText), 1000);
    return;
  }

  const prevPressure = pressure;
  if(c.type==='solicitor'){
    pressure = clamp(pressure + (ch.pressureDelta||0));
    if(ch.tone==='good') firmCount++;
  } else {
    community = clamp(community + (ch.communityDelta||0));
  }

  if(c.type==='solicitor' && pressure >= 100){
    setTimeout(()=> renderFail('対応しきれず',
      '気づけば長い勧誘トークに付き合わされ、断るタイミングを失ってしまった。'), 1000);
    return;
  }

  const needle = document.getElementById('needleLine');
  if(needle){ needle.style.transform = `rotate(${needleAngle(pressure)}deg)`; }
  const numEl = document.getElementById('gaugeNum');
  if(numEl && prevPressure !== pressure){ animateNumber(numEl, prevPressure, pressure, 600); }

  const nextId = ch.next;
  const nextRow = document.createElement('div');
  nextRow.className = 'next-row';
  nextRow.innerHTML = `<button class="next-btn" id="nextBtn">${nextId==='END' ? '対応を終える' : '次へ'}</button>`;
  panel.querySelector('.panel-inner').appendChild(nextRow);

  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(nextId === 'END'){
      showReveal(c, ()=>{ currentRoundId=null; caseIdx++; render(); });
    } else {
      currentRoundId = nextId; render();
    }
  });
}

function showReveal(c, cb){
  setPanel(`
    ${logHeader(dateStrFor(caseIdx), `訪問者ファイル No.${caseIdx+1} / ${CASES.length}`)}
    <div class="flip-card">
      <div class="flip-inner" id="flipInner">
        <div class="flip-front">${SEAL_SVG}<div class="cap">ファイルを確認中…</div></div>
        <div class="flip-back">
          <div class="reveal-title">【正体判明】</div>
          <div class="reveal-name">${c.name}</div>
          <div class="reveal-flavor">${c.reveal}</div>
        </div>
      </div>
    </div>
  `);
  setTimeout(()=>{ const el=document.getElementById('flipInner'); if(el) el.classList.add('flipped'); }, 550);
  setTimeout(cb, 2250);
}

function renderFail(title, text){
  ended = true;
  setPanel(`
    ${logHeader(dateStrFor(caseIdx), '記録:対応失敗')}
    <div class="fail-screen">
      <div class="stamp">対応失敗</div>
      <div class="end-title">${title}</div>
      <div class="fail-desc">${text}</div>
      ${tipsBlock()}
      <div class="next-row"><button class="next-btn" id="retryBtn">もう一度挑戦する</button></div>
    </div>
  `);
  document.getElementById('retryBtn').addEventListener('click', resetGame);
}

let lastEnding = null;

function renderEnding(){
  let rank, title, desc;
  if(firmCount === totalPressureRounds){
    rank='S'; title='完璧な対応だった';
    desc='最後まで一貫して、礼儀正しくもきっぱりと断り続けた。感情に訴えられても揺らがず、個人情報も一切渡さない、理想的な対応だった。';
  } else if(firmCount >= totalPressureRounds*0.7){
    rank='A'; title='かなり手堅い対応だった';
    desc='ほとんどの場面でしっかり断ることができた。何度か話を合わせてしまう場面もあったが、大きな失点なく切り抜けた。';
  } else if(firmCount >= totalPressureRounds*0.45){
    rank='B'; title='まずまずの対応だった';
    desc='押し切られそうになる場面もあったが、なんとか最後まで対応しきった。次はもう少し早い段階で「結構です」を言い切れると安心だ。';
  } else {
    rank='C'; title='ぎりぎり切り抜けた';
    desc='何度も話に引き込まれそうになったが、危険度が上限に達する前に全ての来訪者をやり過ごせた。断りのタイミングを早めるとさらに楽になる。';
  }
  let communityLine;
  if(community >= 70) communityLine = 'ご近所からも「感じの良い人」と評判のようだ。';
  else if(community >= 40) communityLine = 'ご近所付き合いは可もなく不可もなく、といったところ。';
  else communityLine = 'ただ、ご近所からは少し「そっけない人」と思われているかもしれない。';

  lastEnding = { rank, title, desc, communityLine };

  setPanel(`
    ${logHeader(dateStrEpilogue(), '記録:全ファイル対応完了')}
    <div class="end-screen">
      <div class="end-rank">${rank}</div>
      <div class="end-title">${title}</div>
      <div class="end-community">${communityLine}</div>
      <div class="end-desc">${desc}</div>
      ${tipsBlock()}
      <div class="next-row">
        <button class="next-btn" id="reviewBtn">各ファイルを見返す</button>
        <button class="next-btn ghost" id="retryBtn">もう一度挑戦する</button>
      </div>
    </div>
  `);
  document.getElementById('retryBtn').addEventListener('click', resetGame);
  document.getElementById('reviewBtn').addEventListener('click', renderResultsIndex);
}

function verdictFor(entry){
  if(entry.type==='solicitor'){
    const goodCount = entry.entries.filter(e=>e.tone==='good').length;
    const ratio = goodCount / entry.entries.length;
    if(ratio === 1) return '◎ 完璧に対応';
    if(ratio >= 0.5) return '○ 概ね良好';
    return '△ 押され気味';
  } else {
    const sum = entry.entries.reduce((a,e)=>a+e.delta,0);
    if(sum >= 10) return '◎ 好印象';
    if(sum >= 0) return '○ 普通';
    return '△ そっけない対応';
  }
}

function renderResultsIndex(){
  setPanel(`
    ${logHeader(dateStrEpilogue(), '記録:訪問者ファイル 一覧')}
    <div class="results-list">
      ${history.map((h,i)=>`
        <button class="result-item" data-i="${i}">
          <span class="rname">No.${i+1} ${h.name}</span>
          <span class="rverdict">${verdictFor(h)}</span>
        </button>
      `).join('')}
    </div>
    <div class="next-row"><button class="next-btn ghost" id="backBtn">結果画面に戻る</button></div>
  `);
  document.querySelectorAll('.result-item').forEach(btn=>{
    btn.addEventListener('click', ()=> renderResultsDetail(parseInt(btn.dataset.i)));
  });
  document.getElementById('backBtn').addEventListener('click', ()=>{
    if(lastEnding) renderEnding(); else renderResultsIndex();
  });
}

function renderResultsDetail(i){
  const h = history[i];
  setPanel(`
    ${logHeader(dateStrFor(i), `訪問者ファイル No.${i+1} / ${CASES.length}`)}
    <div class="detail-header">
      <div class="dname">${h.name}</div>
      <div class="dreveal">${h.reveal}</div>
    </div>
    <div class="transcript">
      ${h.entries.map(e=>`
        <div class="qa">
          <div class="q">来訪者:${e.line}</div>
          <div class="a">あなた:${e.choiceText}</div>
          <div class="r">${e.reaction}</div>
        </div>
      `).join('')}
    </div>
    <div class="next-row"><button class="next-btn ghost" id="backBtn">一覧に戻る</button></div>
  `);
  document.getElementById('backBtn').addEventListener('click', renderResultsIndex);
}

function tipsBlock(){
  return `
    <div class="tips">
      <h3>覚え書き — 実践のポイント</h3>
      <ol>
        <li>用件を詳しく聞く前に、早い段階で「結構です」と伝える</li>
        <li>連絡先・在宅パターンなどの個人情報は渡さない</li>
        <li>家の中には絶対に入れず、ついていかない</li>
        <li>その場で契約書へのサインや商品購入をしない</li>
        <li>身分証や所属の提示を求めるなど、相手の正体を確かめる習慣を持つ</li>
        <li>しつこい場合は同じ言葉を繰り返し、必要なら管理会社や警察への相談も検討する</li>
      </ol>
    </div>
  `;
}

function resetGame(){
  caseIdx=0; currentRoundId=null; pressure=15; community=50; firmCount=0; ended=false;
  history=[]; lastEnding=null;
  render();
}

renderTitle();
</script>
</body>
</html>
